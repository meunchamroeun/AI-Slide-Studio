<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181513"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Subtle ambient brand glow -->
  <circle cx="256" cy="256" r="140" fill="url(#brandGrad)" opacity="0.18" filter="blur(40px)"/>

  <!-- Back Layer Slide Card -->
  <rect
    x="100"
    y="90"
    width="310"
    height="210"
    rx="32"
    transform="rotate(-8 256 195)"
    stroke="url(#brandGrad)"
    stroke-width="16"
    stroke-opacity="0.35"
    fill="#1c1917"
    fill-opacity="0.6"
  />

  <!-- Mid Layer Slide Card -->
  <rect
    x="120"
    y="140"
    width="310"
    height="210"
    rx="32"
    transform="rotate(-4 275 245)"
    stroke="url(#brandGrad)"
    stroke-width="16"
    stroke-opacity="0.65"
    fill="#1c1917"
    fill-opacity="0.8"
  />

  <!-- Front Primary Slide Card -->
  <rect
    x="101"
    y="180"
    width="310"
    height="210"
    rx="32"
    fill="url(#glassGrad)"
    stroke="url(#brandGrad)"
    stroke-width="18"
    filter="url(#softGlow)"
  />

  <!-- Slide Header Bar -->
  <rect x="145" y="225" width="105" height="24" rx="12" fill="url(#brandGrad)"/>

  <!-- Slide Content Lines -->
  <rect x="145" y="275" width="130" height="18" rx="9" fill="#a8a29e" opacity="0.6"/>
  <rect x="145" y="315" width="85" height="18" rx="9" fill="#a8a29e" opacity="0.35"/>

  <!-- Kinetic Play / Sparkle Glyph -->
  <path
    d="M315 250 L375 285 L315 320 Z"
    fill="url(#brandGrad)"
  />
</svg>
