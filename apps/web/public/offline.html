<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · SlideStudio.ai</title>
    <style>
      :root {
        --bg: #0f0d0c;
        --card: #1c1917;
        --border: rgba(255, 255, 255, 0.1);
        --foreground: #fafaf9;
        --muted: #a8a29e;
        --brand: #f59e0b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--foreground);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background-color: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      }
      .icon-mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: var(--brand);
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: var(--foreground);
        color: var(--bg);
        font-weight: 600;
        font-size: 13px;
        padding: 10px 24px;
        border-radius: 9999px;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .badge {
        display: inline-block;
        margin-top: 20px;
        font-size: 11px;
        color: var(--muted);
        padding: 4px 12px;
        border-radius: 9999px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-mark">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You're Offline</h1>
      <p>
        SlideStudio needs an active connection to reach Gemini AI and the API, but previously generated HTML presentations run 100% offline!
      </p>
      <button class="btn" onclick="window.location.reload()">
        Try Reconnecting
      </button>
      <div>
        <span class="badge">SlideStudio.ai · Standalone Presentation Engine</span>
      </div>
    </div>
  </body>
</html>
